services:
  app:
    image: ghcr.io/YOUR_ORG/app:${IMAGE_TAG}
    container_name: app
    restart: always
    # Must exceed application.properties' spring.lifecycle.timeout-per-shutdown-phase
    # (25s) so Docker's SIGKILL fallback never fires before Spring's own
    # graceful drain finishes.
    stop_grace_period: 30s

    # Not published to the host directly — the shared Caddy stack
    # (../../caddy/docker-compose.yml) fronts it with TLS over the shared
    # oke-internal network instead. Only `expose` (internal to the compose
    # network), no `ports`.
    expose:
      - "8081"

    env_file:
      - .env

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8081/actuator/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - oke-internal

networks:
  # Created once on the host with: docker network create oke-internal
  # Shared with the Keycloak stack and the Caddy reverse proxy so Caddy can
  # reach this container by its compose service name ("app").
  oke-internal:
    external: true
