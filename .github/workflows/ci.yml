name: App CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # Matches the <repository><id>github</id> in pom.xml, used to
          # resolve the private com.ecofood:core dependency from
          # maven.pkg.github.com/luongngochuy1903/Eco_Core.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_READ_TOKEN

      - name: Maven build and test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        # ./mvnw fails with "Permission denied" — the exec bit was never
        # set on this file (lost/never set when committed from Windows).
        # `bash mvnw` interprets the script directly, bypassing the OS
        # exec-permission check entirely.
        run: bash mvnw clean verify

      - name: Build Docker image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:pr-${{ github.event.pull_request.number }}

      - name: Trivy security scan
        # Pinned to the 0.35.0 release commit, not a tag — nearly every
        # tag from 0.0.1 to 0.34.2 was compromised in a March 2026
        # supply-chain attack (force-pushed to steal CI/CD secrets).
        # 0.35.0 is the first release protected by GitHub's immutable
        # releases feature. Verify against
        # https://github.com/aquasecurity/trivy-action/releases before
        # trusting this blindly.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: app:pr-${{ github.event.pull_request.number }}
          severity: CRITICAL
          exit-code: '1'
