
name: App CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    # MongoDB service for integration tests
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

          # GitHub Packages authentication
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_READ_TOKEN

      - name: Maven build and test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

          # Dedicated MongoDB for CI
          MONGODB_URI: mongodb://127.0.0.1:27017/appdb
          MONGODB_DATABASE: appdb

        # Run wrapper using bash to avoid permission errors
        run: bash mvnw clean verify

      - name: Build Docker image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:pr-${{ github.event.pull_request.number }}

      - name: Trivy security scan
        # Pinned to the existing commit
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: app:pr-${{ github.event.pull_request.number }}
          severity: CRITICAL
          exit-code: '1'
