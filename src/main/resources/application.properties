spring.application.name=${SPRING_APPLICATION_NAME:app}
server.port=${SERVER_PORT:8081}

# --- MongoDB ---
# Connection is built explicitly in MongoConfig.mongoClient() rather than
# relying on Spring Boot's property-bound Mongo auto-configuration (see that
# class's javadoc) — only the database name below is still needed directly
# by Spring Data's MongoDatabaseFactory.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://appuser:password@localhost:27017/appdb?authSource=admin}
spring.data.mongodb.database=${MONGODB_DATABASE:appdb}

# --- Keycloak admin connection (Admin REST API, used to create realms/clients/users) ---
keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:https://20.212.12.205.sslip.io}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:master}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# --- Defaults applied to every newly onboarded tenant's realm/client ---
app.tenant.login-theme=${APP_TENANT_LOGIN_THEME:app}
app.tenant.redirect-uri=${APP_TENANT_REDIRECT_URI:http://localhost:3000/*}
app.tenant.web-origin=${APP_TENANT_WEB_ORIGIN:http://localhost:3000}
app.tenant.smtp-host=${APP_TENANT_SMTP_HOST:smtp-relay.brevo.com}
app.tenant.smtp-port=${APP_TENANT_SMTP_PORT:587}
app.tenant.smtp-from=${APP_TENANT_SMTP_FROM:no-reply@ecofood.local}
app.tenant.smtp-auth=${APP_TENANT_SMTP_AUTH:true}
app.tenant.smtp-starttls=${APP_TENANT_SMTP_STARTTLS:true}
app.tenant.smtp-user=${APP_TENANT_SMTP_USER:}
app.tenant.smtp-password=${APP_TENANT_SMTP_PASSWORD:}

# --- Internal token (auth module) ---
# Must be base64 — DCMP's real JwtTokenUtil does Decoders.BASE64.decode(secret)
# then Keys.hmacShaKeyFor(...), so the raw decoded value needs to be >=32
# bytes for HS256. The local default below decodes to 58 bytes.
jwt.secret=${JWT_SECRET:bG9jYWwtZGV2LW9ubHktaG1hYy1zZWNyZXQtY2hhbmdlLWJlZm9yZS1hbnktcmVhbC11c2UtMDEyMw==}
jwt.tokenValidityInSeconds=${JWT_TOKEN_VALIDITY_SECONDS:1800}
jwt.refreshTokenValidityInSeconds=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:86400}
# Custom "iss"/"aud" map claims on our own token (NOT jjwt's registered
# issuer/audience) — matches DCMP's real JwtTokenUtil exactly.
jwt.issuer=${JWT_ISSUER:app}
jwt.audience=${JWT_AUDIENCE:app-api}
# Only Keycloak issuers under this prefix are trusted for exchange.
jwt.trustedIssuerPrefix=${JWT_TRUSTED_ISSUER_PREFIX:https://20.212.12.205.sslip.io/realms/}
